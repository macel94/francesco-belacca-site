name: Supply chain checks

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.xml'
      - '*.txt'
      - 'Caddyfile'
      - 'scripts/supply-chain.sh'
      - '.github/workflows/supply-chain.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on HIGH or CRITICAL findings (reviewed security run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: SBOM and vulnerability scan
    runs-on: ubuntu-latest
    env:
      IMAGE: francesco-belacca-site:supply-chain
      STRICT: ${{ inputs.strict || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build local image
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA}" --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" --tag "$IMAGE" .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          artifact-name: francesco-belacca-site.sbom.cdx.json
          output-file: francesco-belacca-site.sbom.cdx.json
          upload-artifact: true
      - name: Scan image with Trivy (report-only by default)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: francesco-belacca-site.trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.STRICT == 'true' && '1' || '0' }}
      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: francesco-belacca-site-trivy
          path: francesco-belacca-site.trivy.json
          if-no-files-found: warn
