name: External synthetic check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The endpoint is an out-of-band repository/org variable. No URL means a safe
# skipped check; no secret or production endpoint is committed here.
permissions:
  contents: read

jobs:
  public-endpoint:
    name: Public site endpoint
    runs-on: ubuntu-latest
    env:
      SYNTHETIC_SITE_URL: ${{ vars.SYNTHETIC_SITE_URL }}
      SYNTHETIC_ALIAS_URLS: ${{ vars.SYNTHETIC_ALIAS_URLS }}
      SYNTHETIC_REDIRECT_PATHS: ${{ vars.SYNTHETIC_REDIRECT_PATHS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check configured site endpoint
        run: ./scripts/synthetic-check.sh
