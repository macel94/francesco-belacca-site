name: Test and publish site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'reliability.html'
      - 'status.html'
      - 'status.json'
      - 'status.schema.json'
      - 'status-contract.md'
      - 'status.js'
      - 'styles.css'
      - 'app.js'
      - 'count.js'
      - 'privacy.html'
      - 'favicon.svg'
      - 'favicon.ico'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'nginx.conf'
      - 'security-headers.conf'
      - 'Dockerfile'
      - 'package.json'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/test-and-publish.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Build container
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA}" --tag francesco-belacca-site:test .

  publish:
    name: Publish immutable image
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'deploy: publish site') }}"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/macel94/francesco-belacca-site:sha-${{ github.sha }}
            ghcr.io/macel94/francesco-belacca-site:latest
          provenance: false
          sbom: true
      - name: Attest image provenance with GitHub
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/macel94/francesco-belacca-site
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record deployed image
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          sed -i -E "s#(newTag: ).*#\\1${tag}#" deploy/kustomization.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: publish site ${tag}"
          git push
