name: Test and publish site

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'reliability.html'
      - 'reliability.js'
      - 'reliability-evidence.js'
      - 'reliability-evidence.json'
      - 'reliability-evidence.schema.json'
      - 'status.html'
      - 'status.json'
      - 'status.schema.json'
      - 'status-contract.md'
      - 'portfolio-slo.json'
      - 'portfolio-slo.schema.json'
      - 'docs/**'
      - 'scripts/**'
      - 'security/**'
      - 'status.js'
      - 'styles.css'
      - 'app.js'
      - 'count.js'
      - 'privacy.html'
      - 'favicon.svg'
      - 'favicon-tab.svg'
      - 'favicon.ico'
      - 'icon-16.png'
      - 'icon-32.png'
      - 'apple-touch-icon.png'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'site.webmanifest'
      - 'robots.txt'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'Caddyfile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/test-and-publish.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
      - name: Validate deterministic reliability checks
        run: |
          node scripts/validate-slo.mjs
          node scripts/validate-reliability-evidence.mjs
          ./scripts/synthetic-check.sh --dry-run
          ./scripts/runtime-check.sh
          ./scripts/gitops-rollback-check.sh
      - name: Build container
        run: docker build --build-arg BUILD_SHA="${GITHUB_SHA}" --build-arg BUILD_RUN_ID="${GITHUB_RUN_ID}" --tag francesco-belacca-site:test .

  publish:
    name: Publish immutable image
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'deploy: publish site') }}"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_RUN_ID=${{ github.run_id }}
          tags: |
            ghcr.io/macel94/francesco-belacca-site:sha-${{ github.sha }}
            ghcr.io/macel94/francesco-belacca-site:latest
          provenance: false
          sbom: true
      - name: Set immutable image identity
        id: image
        env:
          IMAGE_NAME: ghcr.io/macel94/francesco-belacca-site
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "reference=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: json
          output: francesco-belacca-site.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          exit-code: '0'

      - name: Upload scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: francesco-belacca-site-security-${{ github.sha }}
          path: |
            francesco-belacca-site.trivy.json
            security/site.openvex.json
          if-no-files-found: warn

      - name: Create vulnerability decision
        env:
          IMAGE_NAME: ghcr.io/macel94/francesco-belacca-site
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/create-vulnerability-decision.mjs \
            --input francesco-belacca-site.trivy.json \
            --output francesco-belacca-site.vulnerability-decision.json \
            --image "$IMAGE_NAME" \
            --digest "$IMAGE_DIGEST"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const decision = JSON.parse(await readFile("francesco-belacca-site.vulnerability-decision.json", "utf8"));
            if (["HIGH", "CRITICAL"].includes(decision.maxSeverity) || decision.knownUnfixed) {
              throw new Error(`native-production-v1 promotion blocked: maxUnfixedSeverity=${decision.maxSeverity}, maxObservedSeverity=${decision.maxObservedSeverity}, knownUnfixed=${decision.knownUnfixed}`);
            }
          '

      - name: Generate registry SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: cyclonedx-json
          output-file: francesco-belacca-site.sbom.cdx.json
          upload-artifact: false

      - name: Attest image provenance with GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/macel94/francesco-belacca-site
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM with GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/macel94/francesco-belacca-site
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: francesco-belacca-site.sbom.cdx.json
          push-to-registry: true

      - name: Attest native production vulnerability decision
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/macel94/francesco-belacca-site
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-type: https://belacca.com/attestations/vulnerability/v1
          predicate-path: francesco-belacca-site.vulnerability-decision.json
          push-to-registry: true

      - name: Record deployed immutable image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          sed -i -E "s#(    newTag: ).*#\\1${tag}#" deploy/kustomization.yaml
          if grep -q '^    digest:' deploy/kustomization.yaml; then
            sed -i -E "s#(    digest: ).*#\\1${IMAGE_DIGEST}#" deploy/kustomization.yaml
          else
            sed -i "/^    newTag:/a\\    digest: ${IMAGE_DIGEST}" deploy/kustomization.yaml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: publish site ${tag}"
          git push
